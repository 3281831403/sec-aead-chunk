[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeadchunk"
version = "0.1.0"
description = "Chunked authenticated encryption with sequence and context binding"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]